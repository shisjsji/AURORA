name: android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project compiles against SDK 37 and uses AGP 9, so the runner's preinstalled SDK is
      # almost always too old. Install the two packages the build actually names.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      # The repository has no wrapper, and the AGP 9 build needs Gradle 9.x; pin it here rather
      # than depending on whatever the runner image happens to ship.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Unit tests only: they cover the curve maths, the pack rules and the session expiry, and
      # they need no device. Signing is not needed either, which is why this runs on a clean
      # checkout with no keystore.
      - name: Unit tests
        working-directory: aurora-lsp
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: aurora-lsp/app/build/reports/tests/testDebugUnitTest
